##############################################################################
# Enterprise Python Demo -- full GitLab CI/CD pipeline
#
# Maps directly to the capability matrix:
#   Source Control      -> this repo, branches, MRs (native GitLab)
#   Code Review          -> .gitlab/CODEOWNERS + MR approval rules
#   CI                   -> lint / unit-test / code-quality stages
#   Security             -> sast / dependency-scan / secret-detection / bandit
#   CD                   -> deploy-dev / deploy-uat / deploy-prod stages
#   Release Management   -> release stage (git tag + GitLab Release + changelog)
#   Change Management     -> manual gates tied to CR ticket variable
#   Audit                -> environments + deployment history (native GitLab)
#   Monitoring            -> notify stage (Slack/Teams) + /version smoke check
#   DB Migration          -> migrate-<env> jobs (Alembic)
#   IaC                   -> terraform-plan / terraform-apply
#   Performance/API test  -> performance-test / api-regression stages
#   Rollback              -> manual rollback-<env> jobs
#   Multi-env promotion   -> dev -> uat -> prod, each gated behind the last
##############################################################################

stages:
  - build
  - quality
  - test
  - security
  - package
  - iac
  - deploy-dev
  - api-test-dev
  - deploy-uat
  - performance-test
  - approval
  - deploy-prod
  - migrate-prod
  - release
  - notify

variables:
  PYTHON_IMAGE: "python:3.11-slim"
  APP_VERSION: "${CI_COMMIT_TAG:-0.0.0-${CI_PIPELINE_IID}}"
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"
  DOCKER_TLS_CERTDIR: "/certs"

default:
  image: ${PYTHON_IMAGE}
  before_script:
    - python -V

# ---------------------------------------------------------------------------
# Cache pip downloads between jobs/branches for faster pipelines
# ---------------------------------------------------------------------------
.cache_pip: &cache_pip
  cache:
    key:
      files:
        - requirements-dev.txt
    paths:
      - .cache/pip
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

##############################################################################
# BUILD -- install deps once, reuse via cache
##############################################################################
install-deps:
  stage: build
  <<: *cache_pip
  script:
    - pip install --cache-dir "$PIP_CACHE_DIR" -r requirements-dev.txt
  artifacts:
    paths:
      - .cache/pip
    expire_in: 1 hour

##############################################################################
# QUALITY (Code Quality: linting/formatting)
##############################################################################
lint-flake8:
  stage: quality
  <<: *cache_pip
  script:
    - pip install --cache-dir "$PIP_CACHE_DIR" -r requirements-dev.txt
    - flake8 app tests --output-file=flake8-report.txt || true
    - cat flake8-report.txt
    - flake8 app tests
  artifacts:
    when: always
    paths:
      - flake8-report.txt

format-check:
  stage: quality
  <<: *cache_pip
  script:
    - pip install --cache-dir "$PIP_CACHE_DIR" -r requirements-dev.txt
    - black --check app tests
    - isort --check-only app tests

type-check:
  stage: quality
  <<: *cache_pip
  allow_failure: true
  script:
    - pip install --cache-dir "$PIP_CACHE_DIR" -r requirements-dev.txt
    - mypy app

##############################################################################
# TEST (CI: unit tests + coverage)
##############################################################################
unit-tests:
  stage: test
  <<: *cache_pip
  script:
    - pip install --cache-dir "$PIP_CACHE_DIR" -r requirements-dev.txt
    - pytest tests/test_main.py -m "not regression" --cov=app --cov-report=xml --cov-report=term --junitxml=junit.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml

##############################################################################
# SECURITY
#   - GitLab-managed SAST / Dependency Scanning / Secret Detection templates
#   - plus explicit bandit + safety jobs for transparency in this demo
##############################################################################
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

bandit-scan:
  stage: security
  <<: *cache_pip
  script:
    - pip install --cache-dir "$PIP_CACHE_DIR" -r requirements-dev.txt
    - bandit -r app -f json -o bandit-report.json || true
    - bandit -r app
  artifacts:
    when: always
    paths:
      - bandit-report.json

dependency-safety-check:
  stage: security
  <<: *cache_pip
  script:
    - pip install --cache-dir "$PIP_CACHE_DIR" -r requirements-dev.txt
    - safety check -r requirements.txt --output json > safety-report.json || true
    - safety check -r requirements.txt
  artifacts:
    when: always
    paths:
      - safety-report.json
  allow_failure: true

##############################################################################
# PACKAGE (build & push image, secret creds via CI/CD variables + registry)
##############################################################################
docker-build-push:
  stage: package
  image: docker:26
  services:
    - docker:26-dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_TAG'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --build-arg APP_VERSION=${APP_VERSION} -t "${CI_REGISTRY_IMAGE}:${IMAGE_TAG}" -t "${CI_REGISTRY_IMAGE}:latest" .
    - docker push "${CI_REGISTRY_IMAGE}:${IMAGE_TAG}"
    - docker push "${CI_REGISTRY_IMAGE}:latest"

container-scan:
  stage: package
  needs: ["docker-build-push"]
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_TAG'
  script:
    - trivy image --exit-code 0 --severity HIGH,CRITICAL --format table "${CI_REGISTRY_IMAGE}:${IMAGE_TAG}"

##############################################################################
# IaC -- Terraform plan/apply (Infrastructure as Code)
##############################################################################
terraform-plan:
  stage: iac
  image: hashicorp/terraform:1.7
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - cd terraform
    - terraform init
    - terraform plan -var="environment=dev" -out=plan.tfplan
  artifacts:
    paths:
      - terraform/plan.tfplan

terraform-apply:
  stage: iac
  image: hashicorp/terraform:1.7
  needs: ["terraform-plan"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
  script:
    - cd terraform
    - terraform init
    - terraform apply -auto-approve plan.tfplan

##############################################################################
# CD -- DEV
##############################################################################
deploy-dev:
  stage: deploy-dev
  image: bitnami/kubectl:1.30
  environment:
    name: dev
    url: https://dev.enterprise-demo.example.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - apk add --no-cache kustomize || true
    - ./scripts/deploy.sh dev "${IMAGE_TAG}"

migrate-dev:
  stage: deploy-dev
  needs: ["deploy-dev"]
  environment:
    name: dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - pip install alembic sqlalchemy psycopg2-binary
    - ENVIRONMENT=dev DATABASE_URL="$DEV_DATABASE_URL" ./scripts/migrate.sh

review-app:
  stage: deploy-dev
  image: docker:26
  services:
    - docker:26-dind
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: https://$CI_COMMIT_REF_SLUG.review.enterprise-demo.example.com
    on_stop: stop-review-app
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - echo "Spin up ephemeral preview environment for MR !${CI_MERGE_REQUEST_IID}"
    - docker compose -f docker-compose.yml up -d --build

stop-review-app:
  stage: deploy-dev
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
  script:
    - docker compose -f docker-compose.yml down

##############################################################################
# API regression test against DEV
##############################################################################
api-regression-dev:
  stage: api-test-dev
  <<: *cache_pip
  needs: ["deploy-dev", "migrate-dev"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - pip install --cache-dir "$PIP_CACHE_DIR" -r requirements-dev.txt
    - API_BASE_URL=https://dev.enterprise-demo.example.com pytest tests/test_api.py -m regression --junitxml=api-regression-dev.xml
  artifacts:
    when: always
    reports:
      junit: api-regression-dev.xml

##############################################################################
# CD -- UAT (multi-env promotion step 2)
##############################################################################
deploy-uat:
  stage: deploy-uat
  image: bitnami/kubectl:1.30
  needs: ["api-regression-dev"]
  environment:
    name: uat
    url: https://uat.enterprise-demo.example.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual   # QA promotes DEV -> UAT deliberately
  script:
    - apk add --no-cache kustomize || true
    - ./scripts/deploy.sh uat "${IMAGE_TAG}"

migrate-uat:
  stage: deploy-uat
  needs: ["deploy-uat"]
  environment:
    name: uat
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - pip install alembic sqlalchemy psycopg2-binary
    - ENVIRONMENT=uat DATABASE_URL="$UAT_DATABASE_URL" ./scripts/migrate.sh

##############################################################################
# Performance testing against UAT before prod release
##############################################################################
performance-test-uat:
  stage: performance-test
  image: locustio/locust:2.31.5
  needs: ["migrate-uat"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - locust -f tests/performance/locustfile.py --headless -u 50 -r 5 -t 1m
        --host https://uat.enterprise-demo.example.com
        --csv=perf-report --exit-code-on-error 1
  artifacts:
    when: always
    paths:
      - perf-report*.csv

##############################################################################
# CHANGE MANAGEMENT -- explicit approval gate before production
# Requires CHANGE_REQUEST_ID to be set (pipeline variable) proving a linked,
# approved CR/ticket exists, e.g. from ServiceNow.
##############################################################################
change-approval-gate:
  stage: approval
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
  script:
    - |
      if [ -z "${CHANGE_REQUEST_ID:-}" ]; then
        echo "CHANGE_REQUEST_ID variable not set. A linked, approved Change" \
             "Request (e.g. ServiceNow CHG number) is required to promote to PROD."
        exit 1
      fi
    - echo "Approved for production release under change ${CHANGE_REQUEST_ID}"

##############################################################################
# CD -- PROD (multi-env promotion step 3, final manual approval gate)
##############################################################################
deploy-prod:
  stage: deploy-prod
  image: bitnami/kubectl:1.30
  needs: ["change-approval-gate", "performance-test-uat"]
  environment:
    name: production
    url: https://enterprise-demo.example.com
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual   # release managers only promote tagged builds to PROD
  script:
    - apk add --no-cache kustomize || true
    - ./scripts/deploy.sh prod "${IMAGE_TAG}"

migrate-prod:
  stage: migrate-prod
  needs: ["deploy-prod"]
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - pip install alembic sqlalchemy psycopg2-binary
    - ENVIRONMENT=prod DATABASE_URL="$PROD_DATABASE_URL" ./scripts/migrate.sh

rollback-prod:
  stage: deploy-prod
  image: bitnami/kubectl:1.30
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
  script:
    - ./scripts/rollback.sh prod

##############################################################################
# RELEASE MANAGEMENT -- tag, changelog, GitLab Release with artifacts
##############################################################################
create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["migrate-prod"]
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "Publishing release ${CI_COMMIT_TAG} (image ${IMAGE_TAG})"
  release:
    tag_name: "$CI_COMMIT_TAG"
    description: "Automated release for ${CI_COMMIT_TAG}. Image: ${CI_REGISTRY_IMAGE}:${IMAGE_TAG}"

##############################################################################
# MONITORING -- notify Slack/Teams of pipeline & deployment outcomes
##############################################################################
notify-success:
  stage: notify
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_TAG'
      when: on_success
  script:
    - ./scripts/notify.sh success "${CI_ENVIRONMENT_NAME:-pipeline}"

notify-failure:
  stage: notify
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_TAG'
      when: on_failure
  script:
    - ./scripts/notify.sh failure "${CI_ENVIRONMENT_NAME:-pipeline}"

##############################################################################
# SCHEDULED JOBS -- run via a GitLab Pipeline Schedule (cron), not on push
##############################################################################
scheduled-health-audit:
  stage: notify
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - pip install requests
    - python -c "import requests,os,sys; r=requests.get(os.environ.get('API_BASE_URL','https://enterprise-demo.example.com')+'/health', timeout=10); print(r.status_code, r.text); sys.exit(0 if r.status_code==200 else 1)"
