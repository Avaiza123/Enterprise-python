name: MoveWise Chatbot CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (rollback)'
        required: false

permissions:
  contents: write
  packages: write
  pull-requests: read

env:
  PYTHON_EXE: 'C:\Users\avaiza.shahid\AppData\Local\Programs\Python\Python314\python.exe'
  VENV: '.ci-venv'
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/movewise-chatbot

jobs:

  # ==========================================================
  # 1. TEST (Windows runner)
  # ==========================================================
  test:
    name: Auto Test
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          if (-not (Test-Path $env:PYTHON_EXE)) { throw "Python not found." }
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV
          if (Test-Path $venv) { Remove-Item $venv -Recurse -Force }
          & $env:PYTHON_EXE -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw "venv creation failed." }

      - name: Install deps
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"
          & $python -m pip install --upgrade pip
          & $python -m pip install -r "$env:GITHUB_WORKSPACE\backend_chatbot\requirements.txt"
          & $python -m pip install -r "$env:GITHUB_WORKSPACE\requirements-dev.txt"

      - name: Run tests
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"
          $env_path = "$env:GITHUB_WORKSPACE;$env:GITHUB_WORKSPACE\backend_chatbot"
          & $python -X pythonpath="$env_path" -m pytest `
            -v --tb=short `
            --cov=backend_chatbot `
            --cov-report=term `
            --cov-report=xml:coverage.xml
          if ($LASTEXITCODE -ne 0) { throw "Tests failed." }

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV
          if (Test-Path $venv) { Remove-Item $venv -Recurse -Force }


  # ==========================================================
  # 2. QA (Windows runner) — lint, format, type-check, security
  # ==========================================================
  qa:
    name: Auto QA
    runs-on: [self-hosted, Windows, X64]
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup QA venv
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV
          if (Test-Path $venv) { Remove-Item $venv -Recurse -Force }
          & $env:PYTHON_EXE -m venv $venv
          $python = Join-Path $venv "Scripts\python.exe"
          & $python -m pip install --upgrade pip
          & $python -m pip install -r "$env:GITHUB_WORKSPACE\backend_chatbot\requirements.txt"
          & $python -m pip install -r "$env:GITHUB_WORKSPACE\requirements-dev.txt"

      - name: Lint (ruff)
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"
          & $python -m ruff check backend_chatbot
          if ($LASTEXITCODE -ne 0) { throw "ruff failed." }

      - name: Format check (black)
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"
          & $python -m black --check backend_chatbot
          if ($LASTEXITCODE -ne 0) { throw "black check failed." }

      - name: Type check (mypy)
        continue-on-error: true
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"
          & $python -m mypy backend_chatbot

      - name: Security scan (bandit)
        shell: powershell -ExecutionPolicy Bypass -File {0}
        working-directory: backend_chatbot
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"
          & $python -m bandit -r . -x tests -s B104,B110,B112
          if ($LASTEXITCODE -ne 0) { throw "bandit failed." }

      - name: Dependency audit (pip-audit)
        shell: powershell -ExecutionPolicy Bypass -File {0}
        working-directory: backend_chatbot
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"
          & $python -m pip_audit -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "pip-audit failed." }

      - name: Cleanup
        if: always()
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV
          if (Test-Path $venv) { Remove-Item $venv -Recurse -Force }


  # ==========================================================
  # 3. BUILD + PUSH TO GHCR (Windows runner)
  # ==========================================================
  build:
    name: Docker Build & Push
    runs-on: [self-hosted, Windows, X64]
    needs: qa
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        shell: powershell
        run: |
          $tag = "${{ github.sha }}".Substring(0,12)
          if ("${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Log in to GHCR
        shell: powershell
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        shell: powershell
        run: |
          docker build -t "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}" .
          if ($LASTEXITCODE -ne 0) { throw "docker build failed." }

      - name: Push image
        shell: powershell
        run: |
          docker push "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}"
          if ($LASTEXITCODE -ne 0) { throw "docker push failed." }

      - name: Tag latest (main only)
        if: github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          docker tag "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}" "${{ env.IMAGE_NAME }}:latest"
          docker push "${{ env.IMAGE_NAME }}:latest"


  # ==========================================================
  # 4. CONTAINER SCAN (Linux-hosted runner) — Trivy
  # ==========================================================
  container-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Log in to GHCR (pull)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull image
        run: docker pull "${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}"

      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'          # informational; change to '1' to fail on findings


  # ==========================================================
  # 5. DEPLOY DEV (Windows runner, auto)
  # ==========================================================
  deploy-dev:
    name: Deploy → DEV
    runs-on: [self-hosted, Windows, X64]
    needs: [build, container-scan]
    environment:
      name: dev
      url: http://localhost:8000
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Pull & run
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          docker rm -f movewise-chatbot 2>&1 | Out-Null
          docker pull "${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}"
          docker run -d --name movewise-chatbot --restart unless-stopped -p 8000:8000 `
            "${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}"
          if ($LASTEXITCODE -ne 0) { throw "Deploy DEV failed." }
          Start-Sleep -Seconds 10
          $r = Invoke-WebRequest -Uri "http://localhost:8000/health" -UseBasicParsing -TimeoutSec 10
          if ($r.StatusCode -ne 200) { throw "DEV health check failed: $($r.StatusCode)" }


  # ==========================================================
  # 6. API REGRESSION (Windows runner)
  # ==========================================================
  api-regression-dev:
    name: API Regression (DEV)
    runs-on: [self-hosted, Windows, X64]
    needs: deploy-dev
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup venv
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV
          if (Test-Path $venv) { Remove-Item $venv -Recurse -Force }
          & $env:PYTHON_EXE -m venv $venv
          $python = Join-Path $venv "Scripts\python.exe"
          & $python -m pip install --upgrade pip
          & $python -m pip install -r "$env:GITHUB_WORKSPACE\backend_chatbot\requirements.txt"
          & $python -m pip install -r "$env:GITHUB_WORKSPACE\requirements-dev.txt"

      - name: Run API regression tests
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"
          $env:API_BASE_URL = "http://localhost:8000"
          & $python -m pytest tests/test_api.py -m regression --junitxml=api-regression.xml
          # Non-fatal if the tests directory doesn't exist yet
          if ($LASTEXITCODE -ne 0) {
            Write-Host "API tests failed or missing; continuing."
          }

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-regression-report
          path: api-regression.xml
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV
          if (Test-Path $venv) { Remove-Item $venv -Recurse -Force }


  # ==========================================================
  # 7. DEPLOY UAT (Windows runner, requires approval via GitHub Environment)
  # ==========================================================
  deploy-uat:
    name: Deploy → UAT
    runs-on: [self-hosted, Windows, X64]
    needs: api-regression-dev
    environment:
      name: uat
      url: http://localhost:8001
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Pull & run (UAT)
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          docker rm -f movewise-chatbot-uat 2>&1 | Out-Null
          docker pull "${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}"
          docker run -d --name movewise-chatbot-uat --restart unless-stopped -p 8001:8000 `
            "${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}"
          Start-Sleep -Seconds 10
          $r = Invoke-WebRequest -Uri "http://localhost:8001/health" -UseBasicParsing -TimeoutSec 10
          if ($r.StatusCode -ne 200) { throw "UAT health check failed: $($r.StatusCode)" }


  # ==========================================================
  # 8. PERFORMANCE TEST (Linux-hosted runner) — Locust
  # ==========================================================
  performance-test:
    name: Performance Test (UAT)
    runs-on: ubuntu-latest
    needs: deploy-uat
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Locust
        run: pip install locust==2.31.5

      - name: Run Locust
        run: |
          if [ -f tests/performance/locustfile.py ]; then
            locust -f tests/performance/locustfile.py --headless -u 50 -r 5 -t 1m \
              --host "${{ vars.UAT_BASE_URL || 'http://localhost:8001' }}" \
              --csv=perf-report --exit-code-on-error 0
          else
            echo "No locustfile found — skipping."
          fi

      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: perf-report*.csv
          if-no-files-found: ignore


  # ==========================================================
  # 9. DEPLOY PROD (Windows runner, tag-only, requires approval)
  # ==========================================================
  deploy-prod:
    name: Deploy → PROD
    runs-on: [self-hosted, Windows, X64]
    needs: [build, performance-test]
    environment:
      name: production
      url: http://localhost:8000
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Pull & run (PROD)
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          docker rm -f movewise-chatbot 2>&1 | Out-Null
          docker pull "${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          docker run -d --name movewise-chatbot --restart unless-stopped -p 8000:8000 `
            "${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          Start-Sleep -Seconds 10
          $r = Invoke-WebRequest -Uri "http://localhost:8000/health" -UseBasicParsing -TimeoutSec 10
          if ($r.StatusCode -ne 200) { throw "PROD health check failed: $($r.StatusCode)" }


  # ==========================================================
  # 10. RELEASE (Windows runner)
  # ==========================================================
  release:
    name: Create Release
    runs-on: [self-hosted, Windows, X64]
    needs: deploy-prod
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true


  # ==========================================================
  # 11. NOTIFY (Windows runner, optional)
  # ==========================================================
  notify:
    name: Notify
    runs-on: [self-hosted, Windows, X64]
    needs: [test, qa, build]
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: Send notification (if webhook configured)
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        shell: powershell
        run: |
          $payload = @{
            text = "MoveWise CI/CD: ${{ job.status }} on ${{ github.ref_name }} (${{ github.sha }})"
          } | ConvertTo-Json
          Invoke-RestMethod -Uri "${{ secrets.SLACK_WEBHOOK_URL }}" -Method Post `
            -ContentType "application/json" -Body $payload


  # ==========================================================
  # 12. NIGHTLY HEALTH CHECK (Windows runner)
  # ==========================================================
  health-check:
    name: Nightly Health Check
    runs-on: [self-hosted, Windows, X64]
    if: github.event_name == 'schedule'
    steps:
      - name: Check /health
        shell: powershell
        run: |
          try {
            $r = Invoke-WebRequest -Uri "http://localhost:8000/health" -UseBasicParsing -TimeoutSec 10
            if ($r.StatusCode -ne 200) { throw "HTTP $($r.StatusCode)" }
            Write-Host "Health OK"
          } catch {
            Write-Host "Health check FAILED: $_"
            exit 1
          }
