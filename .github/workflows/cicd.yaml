name: Enterprise Python CI/CD Pipeline

on:
  push:
    branches:
      - master
      - deploy
    tags:
      - "v*"

  pull_request:
    branches:
      - master

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to rollback to"
        required: true
        type: string

  schedule:
    - cron: "0 3 * * *"


# ============================================================
# GLOBAL ENVIRONMENT
# ============================================================

env:
  PYTHON_EXE: 'C:\Users\avaiza.shahid\AppData\Local\Programs\Python\Python314\python.exe'
  VENV: '.ci-venv'
  IMAGE_NAME: ghcr.io/avaiza123/enterprise-python


# ============================================================
# JOBS
# ============================================================

jobs:

  # ==========================================================
  # 1. AUTOMATED TESTS
  # ==========================================================

  test:
    name: Automated Tests
    runs-on: [self-hosted, Windows, X64]

    if: >
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/v')

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Python 3.14
      # ------------------------------------------------------

      - name: Verify Python 3.14
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Python Environment"
          Write-Host "=========================================="

          Write-Host "Configured Python:"
          Write-Host $env:PYTHON_EXE

          if (-not (Test-Path $env:PYTHON_EXE)) {
              throw "Python 3.14 was not found at: $env:PYTHON_EXE"
          }

          & $env:PYTHON_EXE --version

          if ($LASTEXITCODE -ne 0) {
              throw "Python execution failed."
          }

          $version = & $env:PYTHON_EXE --version
          Write-Host "Detected: $version"

          if ($version -notmatch "Python 3\.14") {
              throw "Python 3.14 is required."
          }

      # ------------------------------------------------------
      # Virtual Environment
      # ------------------------------------------------------

      - name: Create Virtual Environment
        shell: powershell
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV

          Write-Host "VENV: $venv"

          if (Test-Path $venv) {
              Write-Host "Removing existing virtual environment..."
              Remove-Item $venv -Recurse -Force
          }

          & $env:PYTHON_EXE -m venv $venv

          if ($LASTEXITCODE -ne 0) {
              throw "Virtual environment creation failed."
          }

          $python = Join-Path $venv "Scripts\python.exe"

          if (-not (Test-Path $python)) {
              throw "Virtual environment Python was not created."
          }

          & $python --version

      # ------------------------------------------------------
      # Pip
      # ------------------------------------------------------

      - name: Upgrade pip
        shell: powershell
        run: |
          $python = Join-Path `
            $env:GITHUB_WORKSPACE `
            "$env:VENV\Scripts\python.exe"

          & $python -m pip install --upgrade pip setuptools wheel

          if ($LASTEXITCODE -ne 0) {
              throw "pip upgrade failed."
          }

      # ------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------

      - name: Install Dependencies
        shell: powershell
        run: |
          $python = Join-Path `
            $env:GITHUB_WORKSPACE `
            "$env:VENV\Scripts\python.exe"

          if (Test-Path "requirements.txt") {
              Write-Host "Installing requirements.txt..."
              & $python -m pip install -r requirements.txt

              if ($LASTEXITCODE -ne 0) {
                  throw "requirements.txt installation failed."
              }
          }
          else {
              Write-Host "requirements.txt not found."
          }

          if (Test-Path "requirements-dev.txt") {
              Write-Host "Installing requirements-dev.txt..."
              & $python -m pip install -r requirements-dev.txt

              if ($LASTEXITCODE -ne 0) {
                  throw "requirements-dev.txt installation failed."
              }
          }
          else {
              Write-Host "requirements-dev.txt not found."
          }

      # ------------------------------------------------------
      # Tests
      # ------------------------------------------------------

      - name: Run Unit Tests
        shell: powershell
        run: |
          $python = Join-Path `
            $env:GITHUB_WORKSPACE `
            "$env:VENV\Scripts\python.exe"

          if (-not (Test-Path "tests")) {
              Write-Host "No tests directory found."
              exit 0
          }

          if (-not (Test-Path "tests/test_main.py")) {
              Write-Host "tests/test_main.py not found."
              Write-Host "Running all non-regression tests instead."

              & $python -m pytest `
                tests `
                -m "not regression" `
                --cov=. `
                --cov-report=term-missing `
                --cov-report=xml `
                --junitxml=test-results.xml
          }
          else {
              & $python -m pytest `
                tests/test_main.py `
                -m "not regression" `
                --cov=. `
                --cov-report=term-missing `
                --cov-report=xml `
                --junitxml=test-results.xml
          }

          if ($LASTEXITCODE -ne 0) {
              throw "Unit tests failed."
          }

      # ------------------------------------------------------
      # Reports
      # ------------------------------------------------------

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ github.run_number }}
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: ignore

      # ------------------------------------------------------
      # Cleanup
      # ------------------------------------------------------

      - name: Cleanup Test Environment
        if: always()
        shell: powershell
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV

          if (Test-Path $venv) {
              Remove-Item $venv -Recurse -Force -ErrorAction SilentlyContinue
          }


  # ==========================================================
  # 2. QA
  # ==========================================================

  qa:
    name: Static QA & Security
    runs-on: [self-hosted, Windows, X64]

    needs: test

    if: >
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/v')

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Verify Python 3.14
        shell: powershell
        run: |
          if (-not (Test-Path $env:PYTHON_EXE)) {
              throw "Python 3.14 not found at: $env:PYTHON_EXE"
          }

          & $env:PYTHON_EXE --version

      # ------------------------------------------------------
      # VENV
      # ------------------------------------------------------

      - name: Create Virtual Environment
        shell: powershell
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV

          if (Test-Path $venv) {
              Remove-Item $venv -Recurse -Force
          }

          & $env:PYTHON_EXE -m venv $venv

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to create virtual environment."
          }

          $python = Join-Path $venv "Scripts\python.exe"

          if (-not (Test-Path $python)) {
              throw "Virtual environment Python was not created."
          }

          & $python --version

      # ------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------

      - name: Install QA Dependencies
        shell: powershell
        run: |
          $python = Join-Path `
            $env:GITHUB_WORKSPACE `
            "$env:VENV\Scripts\python.exe"

          & $python -m pip install --upgrade pip setuptools wheel

          if (Test-Path "requirements.txt") {
              & $python -m pip install -r requirements.txt

              if ($LASTEXITCODE -ne 0) {
                  throw "Application dependencies failed."
              }
          }

          if (Test-Path "requirements-dev.txt") {
              & $python -m pip install -r requirements-dev.txt

              if ($LASTEXITCODE -ne 0) {
                  throw "Development dependencies failed."
              }
          }

          & $python -m pip install `
            flake8 `
            black `
            isort `
            mypy `
            bandit `
            pip-audit

          if ($LASTEXITCODE -ne 0) {
              throw "QA tools installation failed."
          }

      # ------------------------------------------------------
      # Flake8
      # ------------------------------------------------------

      - name: Flake8
        shell: powershell
        run: |
          $python = Join-Path `
            $env:GITHUB_WORKSPACE `
            "$env:VENV\Scripts\python.exe"

          & $python -m flake8 . `
            --exclude=.ci-venv,.git,__pycache__,build,dist `
            --max-line-length=120

          if ($LASTEXITCODE -ne 0) {
              throw "Flake8 QA failed."
          }

      # ------------------------------------------------------
      # Black
      # ------------------------------------------------------

      - name: Black Format Check
        shell: powershell
        run: |
          $python = Join-Path `
            $env:GITHUB_WORKSPACE `
            "$env:VENV\Scripts\python.exe"

          & $python -m black --check . `
            --exclude="\.ci-venv|\.git|build|dist"

          if ($LASTEXITCODE -ne 0) {
              throw "Black formatting check failed."
          }

      # ------------------------------------------------------
      # isort
      # ------------------------------------------------------

      - name: isort Check
        shell: powershell
        run: |
          $python = Join-Path `
            $env:GITHUB_WORKSPACE `
            "$env:VENV\Scripts\python.exe"

          & $python -m isort . `
            --check-only `
            --skip .ci-venv `
            --skip .git

          if ($LASTEXITCODE -ne 0) {
              throw "isort check failed."
          }

      # ------------------------------------------------------
      # mypy
      # ------------------------------------------------------

      - name: Mypy
        continue-on-error: true
        shell: powershell
        run: |
          $python = Join-Path `
            $env:GITHUB_WORKSPACE `
            "$env:VENV\Scripts\python.exe"

          if (Test-Path "backend") {
              & $python -m mypy backend
          }
          elseif (Test-Path "src") {
              & $python -m mypy src
          }
          else {
              Write-Host "No backend or src directory found."
              Write-Host "Skipping mypy."
          }

      # ------------------------------------------------------
      # Bandit
      # ------------------------------------------------------

      - name: Bandit Security Scan
        shell: powershell
        run: |
          $python = Join-Path `
            $env:GITHUB_WORKSPACE `
            "$env:VENV\Scripts\python.exe"

          if (Test-Path "backend") {
              & $python -m bandit -r backend -f txt

              if ($LASTEXITCODE -ne 0) {
                  throw "Bandit security scan failed."
              }
          }
          elseif (Test-Path "src") {
              & $python -m bandit -r src -f txt

              if ($LASTEXITCODE -ne 0) {
                  throw "Bandit security scan failed."
              }
          }
          else {
              Write-Host "No backend or src directory found."
              Write-Host "Skipping Bandit."
          }

      # ------------------------------------------------------
      # pip-audit
      # ------------------------------------------------------

      - name: pip-audit
        continue-on-error: true
        shell: powershell
        run: |
          $python = Join-Path `
            $env:GITHUB_WORKSPACE `
            "$env:VENV\Scripts\python.exe"

          & $python -m pip_audit

      # ------------------------------------------------------
      # Cleanup
      # ------------------------------------------------------

      - name: Cleanup QA Environment
        if: always()
        shell: powershell
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV

          if (Test-Path $venv) {
              Remove-Item $venv -Recurse -Force -ErrorAction SilentlyContinue
          }


  # ==========================================================
  # 3. DOCKER BUILD
  # ==========================================================

  build:
    name: Build & Push Docker Image
    runs-on: [self-hosted, Windows, X64]

    needs: qa

    if: >
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/v')

    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
      image_name: ${{ steps.image.outputs.image_name }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Image Tag
      # ------------------------------------------------------

      - name: Calculate Image Tag
        id: image
        shell: powershell
        run: |
          $imageName = "${{ env.IMAGE_NAME }}"

          if ("${{ github.ref }}" -like "refs/tags/*") {
              $tag = "${{ github.ref_name }}"
          }
          else {
              $tag = "${{ github.sha }}".Substring(0, 12)
          }

          Write-Host "Image Name: $imageName"
          Write-Host "Image Tag:  $tag"

          "image_tag=$tag" >> $env:GITHUB_OUTPUT
          "image_name=$imageName" >> $env:GITHUB_OUTPUT

      # ------------------------------------------------------
      # Docker
      # ------------------------------------------------------

      - name: Check Docker
        shell: powershell
        run: |
          docker --version

          if ($LASTEXITCODE -ne 0) {
              throw "Docker is not available."
          }

      # ------------------------------------------------------
      # GHCR Login
      # ------------------------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      # ------------------------------------------------------
      # Build
      # ------------------------------------------------------

      - name: Build Docker Image
        shell: powershell
        run: |
          $image = "${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.image_tag }}"

          Write-Host "Building:"
          Write-Host $image

          docker build `
            --tag $image `
            .

          if ($LASTEXITCODE -ne 0) {
              throw "Docker build failed."
          }

      # ------------------------------------------------------
      # Push
      # ------------------------------------------------------

      - name: Push Docker Image
        shell: powershell
        run: |
          $image = "${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.image_tag }}"

          docker push $image

          if ($LASTEXITCODE -ne 0) {
              throw "Docker push failed."
          }

      # ------------------------------------------------------
      # Latest
      # ------------------------------------------------------

      - name: Tag Latest
        if: github.ref == 'refs/heads/master'
        shell: powershell
        run: |
          $source = "${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.image_tag }}"
          $latest = "${{ steps.image.outputs.image_name }}:latest"

          docker tag $source $latest

          if ($LASTEXITCODE -ne 0) {
              throw "Docker latest tag failed."
          }

          docker push $latest

          if ($LASTEXITCODE -ne 0) {
              throw "Docker latest push failed."
          }


  # ==========================================================
  # 4. CONTAINER SECURITY SCAN
  # ==========================================================

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest

    needs: build

    if: >
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/v')

    steps:

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.image_name }}:${{ needs.build.outputs.image_tag }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"


  # ==========================================================
  # 5. TERRAFORM PLAN
  # ==========================================================

  # terraform-plan:
  #   name: Terraform Plan
  #   runs-on: ubuntu-latest

  #   needs: build

  #   if: >
  #     github.ref == 'refs/heads/master'

  #   continue-on-error: true

  #   steps:

  #     - name: Checkout
  #       uses: actions/checkout@v4

  #     - name: Check Terraform Files
  #       id: terraform_check
  #       shell: bash
