  #           echo "has_terraform=false" >> "$GITHUB_OUTPUT"
  #         fi

  #     - name: Setup Terraform
  #       if: steps.terraform_check.outputs.has_terraform == 'true'
  #       uses: hashicorp/setup-terraform@v3
  #       with:
  #         terraform_version: "1.7.5"

  #     - name: Terraform Init
  #       if: steps.terraform_check.outputs.has_terraform == 'true'
