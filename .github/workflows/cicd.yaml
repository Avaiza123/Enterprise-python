  #       with:
  #         name: terraform-plan-${{ github.run_number }}
  #         path: terraform/plan.tfplan
  #         if-no-files-found: ignore


  # ==========================================================
  # 6. DEVELOPMENT DEPLOYMENT
  # ==========================================================

  deploy-dev:
    name: Deploy Development
    runs-on: [self-hosted, Windows, X64]

    needs:
      - build
      - container-scan

    if: github.ref == 'refs/heads/master'

    environment:
      name: development
      url: http://localhost:8000

    steps:

      - name: Login to GHCR
        shell: powershell
        run: |
          "${{ secrets.GHCR_PAT }}" |
            docker login ghcr.io `
              -u "${{ github.actor }}" `
              --password-stdin

      - name: Stop Existing Development Container
        shell: powershell
        run: |
          docker rm -f enterprise-python-dev 2>$null
          exit 0

      - name: Pull Image
        shell: powershell
        run: |
          $image = "${{ needs.build.outputs.image_name }}:${{ needs.build.outputs.image_tag }}"

          docker pull $image

          if ($LASTEXITCODE -ne 0) {
              throw "Docker pull failed."
          }

      - name: Deploy Development Container
        shell: powershell
        run: |
          $image = "${{ needs.build.outputs.image_name }}:${{ needs.build.outputs.image_tag }}"

          docker run -d `
            --name enterprise-python-dev `
            --restart unless-stopped `
            -p 8000:8000 `
            $image

          if ($LASTEXITCODE -ne 0) {
              throw "Development deployment failed."
          }

      - name: Wait for Application
        shell: powershell
        run: |
          Start-Sleep -Seconds 10

      - name: Development Health Check
        shell: powershell
        run: |
          $maxAttempts = 12

          for ($i = 1; $i -le $maxAttempts; $i++) {

              try {

                  $response = Invoke-WebRequest `
                    -Uri "http://localhost:8000/health" `
                    -UseBasicParsing `
                    -TimeoutSec 5

                  if ($response.StatusCode -eq 200) {
                      Write-Host "Development application is healthy."
                      exit 0
                  }

              }
              catch {
                  Write-Host "Health check attempt $i failed."
              }

              Start-Sleep -Seconds 5
          }

          Write-Host "Container logs:"
          docker logs enterprise-python-dev

          throw "Development health check failed."


  # ==========================================================
  # 7. DEVELOPMENT MIGRATION
  # ==========================================================

  migrate-dev:
    name: Development Database Migration
    runs-on: [self-hosted, Windows, X64]

    needs: deploy-dev

    if: github.ref == 'refs/heads/master'

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Python 3.14
        shell: powershell
        run: |
          if (-not (Test-Path $env:PYTHON_EXE)) {
              throw "Python 3.14 not found."
          }

          & $env:PYTHON_EXE --version

      - name: Create Virtual Environment
        shell: powershell
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV

          if (Test-Path $venv) {
              Remove-Item $venv -Recurse -Force
          }

          & $env:PYTHON_EXE -m venv $venv

      - name: Install Dependencies
        shell: powershell
        run: |
          $python = Join-Path `
            $env:GITHUB_WORKSPACE `
            "$env:VENV\Scripts\python.exe"

          & $python -m pip install --upgrade pip

          if (Test-Path "requirements.txt") {
              & $python -m pip install -r requirements.txt
          }

      - name: Run Alembic Migration
        shell: powershell
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          $python = Join-Path `
            $env:GITHUB_WORKSPACE `
            "$env:VENV\Scripts\python.exe"

          if (Test-Path "alembic.ini") {

              & $python -m alembic upgrade head

              if ($LASTEXITCODE -ne 0) {
                  throw "Development migration failed."
              }

          }
          else {
              Write-Host "alembic.ini not found."
              Write-Host "Migration skipped."
          }

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV

          if (Test-Path $venv) {
              Remove-Item $venv -Recurse -Force -ErrorAction SilentlyContinue
          }


  # ==========================================================
  # 8. DEVELOPMENT API TEST
  # ==========================================================

  api-test-dev:
    name: Development API Regression Tests
    runs-on: [self-hosted, Windows, X64]

    needs:
      - deploy-dev
      - migrate-dev

    if: github.ref == 'refs/heads/master'

    env:
      API_BASE_URL: http://localhost:8000

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Python 3.14
        shell: powershell
        run: |
          if (-not (Test-Path $env:PYTHON_EXE)) {
              throw "Python 3.14 not found."
          }

          & $env:PYTHON_EXE --version

      - name: Create Virtual Environment
        shell: powershell
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV

          if (Test-Path $venv) {
              Remove-Item $venv -Recurse -Force
          }

          & $env:PYTHON_EXE -m venv $venv

      - name: Install Dependencies
        shell: powershell
        run: |
          $python = Join-Path `
            $env:GITHUB_WORKSPACE `
            "$env:VENV\Scripts\python.exe"

          & $python -m pip install --upgrade pip

          if (Test-Path "requirements.txt") {
              & $python -m pip install -r requirements.txt
          }

          if (Test-Path "requirements-dev.txt") {
              & $python -m pip install -r requirements-dev.txt
          }

      - name: Run API Regression Tests
        shell: powershell
        run: |
          $python = Join-Path `
            $env:GITHUB_WORKSPACE `
            "$env:VENV\Scripts\python.exe"

          if (Test-Path "tests/test_api.py") {

              & $python -m pytest `
                tests/test_api.py `
                -m regression `
                --junitxml=api-test-results.xml

              if ($LASTEXITCODE -ne 0) {
                  throw "API regression tests failed."
              }

          }
          else {
              Write-Host "tests/test_api.py not found."
              Write-Host "API regression tests skipped."
          }

      - name: Upload API Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results-${{ github.run_number }}
          path: api-test-results.xml
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV

          if (Test-Path $venv) {
              Remove-Item $venv -Recurse -Force -ErrorAction SilentlyContinue
          }


  # ==========================================================
  # 9. UAT DEPLOYMENT
  # ==========================================================

  deploy-uat:
    name: Deploy UAT
    runs-on: [self-hosted, Windows, X64]

    needs:
      - api-test-dev
      - build

    if: github.ref == 'refs/heads/master'

    environment:
      name: uat
      url: http://localhost:8001

    steps:

      - name: Login to GHCR
        shell: powershell
        run: |
          "${{ secrets.GHCR_PAT }}" |
            docker login ghcr.io `
              -u "${{ github.actor }}" `
              --password-stdin

      - name: Stop Existing UAT Container
        shell: powershell
        run: |
          docker rm -f enterprise-python-uat 2>$null
          exit 0

      - name: Pull UAT Image
        shell: powershell
        run: |
          $image = "${{ needs.build.outputs.image_name }}:${{ needs.build.outputs.image_tag }}"

          docker pull $image

          if ($LASTEXITCODE -ne 0) {
              throw "UAT image pull failed."
          }

      - name: Deploy UAT Container
        shell: powershell
        run: |
          $image = "${{ needs.build.outputs.image_name }}:${{ needs.build.outputs.image_tag }}"

          docker run -d `
            --name enterprise-python-uat `
            --restart unless-stopped `
            -p 8001:8000 `
            $image

          if ($LASTEXITCODE -ne 0) {
              throw "UAT deployment failed."
          }

      - name: Wait for UAT
        shell: powershell
        run: |
          Start-Sleep -Seconds 10

      - name: UAT Health Check
        shell: powershell
        run: |
          $maxAttempts = 12

          for ($i = 1; $i -le $maxAttempts; $i++) {

              try {

                  $response = Invoke-WebRequest `
                    -Uri "http://localhost:8001/health" `
                    -UseBasicParsing `
                    -TimeoutSec 5

                  if ($response.StatusCode -eq 200) {
                      Write-Host "UAT application is healthy."
                      exit 0
                  }

              }
              catch {
                  Write-Host "UAT health attempt $i failed."
              }

              Start-Sleep -Seconds 5
          }

          Write-Host "UAT container logs:"
          docker logs enterprise-python-uat

          throw "UAT health check failed."


  # ==========================================================
  # 10. UAT MIGRATION
  # ==========================================================

  migrate-uat:
    name: UAT Database Migration
    runs-on: [self-hosted, Windows, X64]

    needs: deploy-uat

    if: github.ref == 'refs/heads/master'

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Python 3.14
        shell: powershell
        run: |
          if (-not (Test-Path $env:PYTHON_EXE)) {
              throw "Python 3.14 not found."
          }

          & $env:PYTHON_EXE --version

      - name: Create Virtual Environment
        shell: powershell
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV

          if (Test-Path $venv) {
              Remove-Item $venv -Recurse -Force
          }

          & $env:PYTHON_EXE -m venv $venv

      - name: Install Dependencies
        shell: powershell
        run: |
          $python = Join-Path `
            $env:GITHUB_WORKSPACE `
            "$env:VENV\Scripts\python.exe"

          & $python -m pip install --upgrade pip

          if (Test-Path "requirements.txt") {
              & $python -m pip install -r requirements.txt
          }

      - name: Run UAT Migration
        shell: powershell
        env:
          DATABASE_URL: ${{ secrets.UAT_DATABASE_URL }}
        run: |
          $python = Join-Path `
            $env:GITHUB_WORKSPACE `
            "$env:VENV\Scripts\python.exe"

          if (Test-Path "alembic.ini") {

              & $python -m alembic upgrade head

              if ($LASTEXITCODE -ne 0) {
                  throw "UAT migration failed."
              }

          }
          else {
              Write-Host "alembic.ini not found."
              Write-Host "Migration skipped."
          }

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV

          if (Test-Path $venv) {
              Remove-Item $venv -Recurse -Force -ErrorAction SilentlyContinue
          }


  # ==========================================================
  # 11. PERFORMANCE TEST
  # ==========================================================

  performance-test:
    name: UAT Performance Test
    runs-on: ubuntu-latest

    needs: migrate-uat

    if: github.ref == 'refs/heads/master'

    continue-on-error: true

    env:
      UAT_PUBLIC_URL: ${{ vars.UAT_PUBLIC_URL || 'http://localhost:8001' }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Locust
        run: |
          python -m pip install --upgrade pip
          python -m pip install locust==2.31.5

      - name: Run Performance Test
        shell: bash
        run: |
          if [ -f "locustfile.py" ]; then

            echo "=========================================="
            echo "UAT Performance Test"
            echo "=========================================="

            echo "UAT URL:"
            echo "$UAT_PUBLIC_URL"

            locust \
              -f locustfile.py \
              --headless \
              --users 10 \
              --spawn-rate 2 \
              --run-time 2m \
              --host "$UAT_PUBLIC_URL" \
              --csv=performance-results \
              --html=performance-report.html

          else
            echo "locustfile.py not found."
            echo "Performance test skipped."
          fi

      - name: Upload Performance Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results-${{ github.run_number }}
          path: |
            performance-results*.csv
            performance-report.html
          if-no-files-found: ignore


  # ==========================================================
  # 12. PRODUCTION CHANGE APPROVAL
  # ==========================================================

  change-approval-gate:
    name: Production Change Approval
    runs-on: ubuntu-latest

    needs:
      - build
      - container-scan

    if: startsWith(github.ref, 'refs/tags/v')

    steps:

      - name: Verify Change Request
        shell: bash
        run: |
          if [ -z "${{ vars.CHANGE_REQUEST_ID }}" ]; then
            echo "CHANGE_REQUEST_ID is not configured."
            exit 1
          fi

          echo "Change Request:"
          echo "${{ vars.CHANGE_REQUEST_ID }}"

      - name: Approval Passed
        run: |
          echo "Production change approval gate passed."


  # ==========================================================
  # 13. PRODUCTION DEPLOYMENT
  # ==========================================================

  deploy-prod:
    name: Deploy Production
    runs-on: [self-hosted, Windows, X64]

    needs:
      - change-approval-gate
      - build

    if: startsWith(github.ref, 'refs/tags/v')

    environment:
      name: production
      url: http://localhost:8002

    steps:

      - name: Login to GHCR
        shell: powershell
        run: |
          "${{ secrets.GHCR_PAT }}" |
            docker login ghcr.io `
              -u "${{ github.actor }}" `
              --password-stdin

      - name: Stop Existing Production Container
        shell: powershell
        run: |
          docker rm -f enterprise-python-prod 2>$null
          exit 0

      - name: Pull Production Image
        shell: powershell
        run: |
          $image = "${{ needs.build.outputs.image_name }}:${{ needs.build.outputs.image_tag }}"

          Write-Host "Production image:"
          Write-Host $image

          docker pull $image

          if ($LASTEXITCODE -ne 0) {
              throw "Production image pull failed."
          }

      - name: Deploy Production Container
        shell: powershell
        run: |
          $image = "${{ needs.build.outputs.image_name }}:${{ needs.build.outputs.image_tag }}"

          docker run -d `
            --name enterprise-python-prod `
            --restart unless-stopped `
            -p 8002:8000 `
            $image

          if ($LASTEXITCODE -ne 0) {
              throw "Production deployment failed."
          }

      - name: Wait for Production
        shell: powershell
        run: |
          Start-Sleep -Seconds 10

      - name: Production Health Check
        shell: powershell
        run: |
          $maxAttempts = 12

          for ($i = 1; $i -le $maxAttempts; $i++) {

              try {

                  $response = Invoke-WebRequest `
                    -Uri "http://localhost:8002/health" `
                    -UseBasicParsing `
                    -TimeoutSec 5

                  if ($response.StatusCode -eq 200) {
                      Write-Host "Production application is healthy."
                      exit 0
                  }

              }
              catch {
                  Write-Host "Production health attempt $i failed."
              }

              Start-Sleep -Seconds 5
          }

          Write-Host "Production container logs:"
          docker logs enterprise-python-prod

          throw "Production health check failed."


  # ==========================================================
  # 14. PRODUCTION MIGRATION
  # ==========================================================

  migrate-prod:
    name: Production Database Migration
    runs-on: [self-hosted, Windows, X64]

    needs: deploy-prod

    if: startsWith(github.ref, 'refs/tags/v')

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Python 3.14
        shell: powershell
        run: |
          if (-not (Test-Path $env:PYTHON_EXE)) {
              throw "Python 3.14 not found."
          }

          & $env:PYTHON_EXE --version

      - name: Create Virtual Environment
        shell: powershell
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV

          if (Test-Path $venv) {
              Remove-Item $venv -Recurse -Force
          }

          & $env:PYTHON_EXE -m venv $venv

      - name: Install Dependencies
        shell: powershell
        run: |
          $python = Join-Path `
            $env:GITHUB_WORKSPACE `
            "$env:VENV\Scripts\python.exe"

          & $python -m pip install --upgrade pip

          if (Test-Path "requirements.txt") {
              & $python -m pip install -r requirements.txt
          }

      - name: Run Production Migration
        shell: powershell
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          $python = Join-Path `
            $env:GITHUB_WORKSPACE `
            "$env:VENV\Scripts\python.exe"

          if (Test-Path "alembic.ini") {

              & $python -m alembic upgrade head

              if ($LASTEXITCODE -ne 0) {
                  throw "Production migration failed."
              }

          }
          else {
              Write-Host "alembic.ini not found."
              Write-Host "Migration skipped."
          }

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV

          if (Test-Path $venv) {
              Remove-Item $venv -Recurse -Force -ErrorAction SilentlyContinue
          }


  # ==========================================================
  # 15. GITHUB RELEASE
  # ==========================================================

  release:
    name: Create GitHub Release
    runs-on: [self-hosted, Windows, X64]

    needs: migrate-prod

    if: startsWith(github.ref, 'refs/tags/v')

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==========================================================
  # 16. NOTIFICATION
  #
  # IMPORTANT:
  # Do NOT use:
  #
  # if: secrets.SLACK_WEBHOOK_URL != ''
  #
  # GitHub does not allow the secrets context in if.
  # The secret is checked inside PowerShell instead.
  # ==========================================================

  notify:
    name: Pipeline Notification
    runs-on: [self-hosted, Windows, X64]

    needs:
      - test
      - qa
      - build
      - container-scan
      - deploy-dev
      - migrate-dev
      - api-test-dev
      - deploy-uat
      - migrate-uat
      - performance-test

    if: >
      always() &&
      github.ref == 'refs/heads/master'

    steps:

      - name: Determine Pipeline Status
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Pipeline Results"
          Write-Host "=========================================="

          Write-Host "Test:              ${{ needs.test.result }}"
          Write-Host "QA:                ${{ needs.qa.result }}"
          Write-Host "Build:             ${{ needs.build.result }}"
          Write-Host "Container Scan:    ${{ needs.container-scan.result }}"
          Write-Host "Deploy Dev:        ${{ needs.deploy-dev.result }}"
          Write-Host "Migration Dev:     ${{ needs.migrate-dev.result }}"
          Write-Host "API Test Dev:      ${{ needs.api-test-dev.result }}"
          Write-Host "Deploy UAT:        ${{ needs.deploy-uat.result }}"
          Write-Host "Migration UAT:     ${{ needs.migrate-uat.result }}"
          Write-Host "Performance:       ${{ needs.performance-test.result }}"

          $results = @(
              "${{ needs.test.result }}",
              "${{ needs.qa.result }}",
              "${{ needs.build.result }}",
              "${{ needs.container-scan.result }}",
              "${{ needs.deploy-dev.result }}",
              "${{ needs.migrate-dev.result }}",
              "${{ needs.api-test-dev.result }}",
              "${{ needs.deploy-uat.result }}",
              "${{ needs.migrate-uat.result }}",
              "${{ needs.performance-test.result }}"
          )

          if ($results -contains "failure") {
              "PIPELINE_STATUS=FAILED" >> $env:GITHUB_ENV
          }
          elseif ($results -contains "cancelled") {
              "PIPELINE_STATUS=CANCELLED" >> $env:GITHUB_ENV
          }
          else {
              "PIPELINE_STATUS=SUCCESS" >> $env:GITHUB_ENV
          }

      - name: Send Slack Notification
        shell: powershell
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SLACK_WEBHOOK_URL)) {
              Write-Host "SLACK_WEBHOOK_URL is not configured."
              Write-Host "Slack notification skipped."
              exit 0
          }

          $payload = @{
              text = "Enterprise Python CI/CD - $env:PIPELINE_STATUS - Run #${{ github.run_number }}"
          } | ConvertTo-Json

          try {

              Invoke-RestMethod `
                -Uri $env:SLACK_WEBHOOK_URL `
                -Method Post `
                -ContentType "application/json" `
                -Body $payload

              Write-Host "Slack notification sent successfully."

          }
          catch {

              Write-Host "Slack notification failed."
              Write-Host $_

              exit 1
          }


  # ==========================================================
  # 17. SCHEDULED HEALTH CHECK
  # ==========================================================

  health-check:
    name: Scheduled Health Check
    runs-on: [self-hosted, Windows, X64]

    if: github.event_name == 'schedule'

    steps:

      - name: Check Production Health
        shell: powershell
        run: |
          try {

              $response = Invoke-WebRequest `
                -Uri "http://localhost:8002/health" `
                -UseBasicParsing `
                -TimeoutSec 10

              if ($response.StatusCode -eq 200) {
                  Write-Host "Production health check passed."
                  exit 0
              }

              throw "Unexpected HTTP status: $($response.StatusCode)"

          }
          catch {

              Write-Host "Production health check failed."
              Write-Host $_

              throw
          }


  # ==========================================================
  # 18. MANUAL PRODUCTION ROLLBACK
  # ==========================================================

  rollback-prod:
    name: Manual Production Rollback
    runs-on: [self-hosted, Windows, X64]

    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.image_tag != ''

    environment:
      name: production

    steps:

      - name: Login to GHCR
        shell: powershell
        run: |
          "${{ secrets.GHCR_PAT }}" |
            docker login ghcr.io `
              -u "${{ github.actor }}" `
              --password-stdin

          if ($LASTEXITCODE -ne 0) {
              throw "GHCR login failed."
          }

      - name: Stop Current Production
        shell: powershell
        run: |
          docker rm -f enterprise-python-prod 2>$null
          exit 0

      - name: Pull Rollback Image
        shell: powershell
        run: |
          $image = "${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}"

          Write-Host "Rollback image:"
          Write-Host $image

          docker pull $image

          if ($LASTEXITCODE -ne 0) {
              throw "Rollback image could not be pulled."
          }

      - name: Deploy Rollback
        shell: powershell
        run: |
          $image = "${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}"

          docker run -d `
            --name enterprise-python-prod `
            --restart unless-stopped `
            -p 8002:8000 `
            $image

          if ($LASTEXITCODE -ne 0) {
              throw "Rollback deployment failed."
          }

      - name: Wait for Rollback
        shell: powershell
        run: |
          Start-Sleep -Seconds 10

      - name: Rollback Health Check
        shell: powershell
        run: |
          $maxAttempts = 12

          for ($i = 1; $i -le $maxAttempts; $i++) {

              try {

                  $response = Invoke-WebRequest `
                    -Uri "http://localhost:8002/health" `
                    -UseBasicParsing `
                    -TimeoutSec 5

                  if ($response.StatusCode -eq 200) {
                      Write-Host "Rollback successful."
                      exit 0
                  }

              }
              catch {
                  Write-Host "Rollback health attempt $i failed."
              }

              Start-Sleep -Seconds 5
          }

          Write-Host "Rollback container logs:"
          docker logs enterprise-python-prod

          throw "Rollback health check failed."
