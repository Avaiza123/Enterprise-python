name: Enterprise Python CI/CD

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (rollback target)'
        required: false

permissions:
  contents: write
  packages: write
  pull-requests: read

env:
  PYTHON_EXE: 'C:\Users\avaiza.shahid\AppData\Local\Programs\Python\Python314\python.exe'
  VENV: '.ci-venv'
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/enterprise-python

jobs:

  # ==========================================================
  # 1. TEST (Windows)
  # ==========================================================
  test:
    name: Auto Test
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          if (-not (Test-Path $env:PYTHON_EXE)) { throw "Python not found." }
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV
          if (Test-Path $venv) { Remove-Item $venv -Recurse -Force }
          & $env:PYTHON_EXE -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw "venv creation failed." }

      - name: Install deps
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"
          & $python -m pip install --upgrade pip
          & $python -m pip install -r "$env:GITHUB_WORKSPACE\requirements.txt"
          & $python -m pip install -r "$env:GITHUB_WORKSPACE\requirements-dev.txt"

      - name: Run unit tests
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"
          & $python -m pytest tests/test_main.py -m "not regression" `
            -v --tb=short `
            --cov=app `
            --cov-report=term `
            --cov-report=xml:coverage.xml `
            --junitxml=junit.xml
          if ($LASTEXITCODE -ne 0) { throw "Tests failed." }

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV
          if (Test-Path $venv) { Remove-Item $venv -Recurse -Force }


  # ==========================================================
  # 2. QA (Windows) — flake8, black, isort, mypy, bandit, pip-audit
  # ==========================================================
  qa:
    name: Auto QA
    runs-on: [self-hosted, Windows, X64]
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup QA venv
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV
          if (Test-Path $venv) { Remove-Item $venv -Recurse -Force }
          & $env:PYTHON_EXE -m venv $venv
          $python = Join-Path $venv "Scripts\python.exe"
          & $python -m pip install --upgrade pip
          & $python -m pip install -r "$env:GITHUB_WORKSPACE\requirements.txt"
          & $python -m pip install -r "$env:GITHUB_WORKSPACE\requirements-dev.txt"

      - name: Lint (flake8)
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"
          & $python -m flake8 app tests
          if ($LASTEXITCODE -ne 0) { throw "flake8 failed." }

      - name: Format check (black)
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"
          & $python -m black --check app tests
          if ($LASTEXITCODE -ne 0) { throw "black check failed." }

      - name: Import order (isort)
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"
          & $python -m isort --check-only app tests
          if ($LASTEXITCODE -ne 0) { throw "isort check failed." }

      - name: Type check (mypy)
        continue-on-error: true
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"
          & $python -m mypy app

      - name: Security scan (bandit)
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"
          & $python -m bandit -r app -s B104,B110,B112
          if ($LASTEXITCODE -ne 0) { throw "bandit failed." }

      - name: Dependency audit (pip-audit)
        continue-on-error: true
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"
          & $python -m pip_audit -r requirements.txt

      - name: Cleanup
        if: always()
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV
          if (Test-Path $venv) { Remove-Item $venv -Recurse -Force }


  # ==========================================================
  # 3. BUILD + PUSH GHCR (Windows)
  # ==========================================================
  build:
    name: Docker Build & Push
    runs-on: [self-hosted, Windows, X64]
    needs: qa
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        shell: powershell
        run: |
          $tag = "${{ github.sha }}".Substring(0,12)
          if ("${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Log in to GHCR
        shell: powershell
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        shell: powershell
        run: |
          docker build -t "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}" .
          if ($LASTEXITCODE -ne 0) { throw "docker build failed." }

      - name: Push image
        shell: powershell
        run: |
          docker push "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}"
          if ($LASTEXITCODE -ne 0) { throw "docker push failed." }

      - name: Tag latest (master only)
        if: github.ref == 'refs/heads/master'
        shell: powershell
        run: |
          docker tag "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}" "${{ env.IMAGE_NAME }}:latest"
          docker push "${{ env.IMAGE_NAME }}:latest"


  # ==========================================================
  # 4. CONTAINER SCAN (ubuntu-latest, Trivy)
  # ==========================================================
  container-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Log in to GHCR (pull)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'


  # ==========================================================
  # 5. TERRAFORM PLAN (ubuntu-latest)
  # ==========================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    continue-on-error: true
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Check for Terraform configs
        id: check
        run: |
          if [ -z "$(ls -A *.tf 2>/dev/null)" ]; then
            echo "no_tf=true" >> $GITHUB_OUTPUT
          fi

      - uses: hashicorp/setup-terraform@v3
        if: steps.check.outputs.no_tf != 'true'
        with:
          terraform_version: 1.7.5

      - name: Terraform Init
        if: steps.check.outputs.no_tf != 'true'
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Plan
        if: steps.check.outputs.no_tf != 'true'
        run: terraform plan -var="environment=dev" -out=plan.tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Upload plan
        if: steps.check.outputs.no_tf != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/plan.tfplan


  # ==========================================================
  # 6. DEPLOY DEV (Windows, auto)
  # ==========================================================
  deploy-dev:
    name: Deploy → DEV
    runs-on: [self-hosted, Windows, X64]
    needs: [build, container-scan]
    environment:
      name: dev
      url: http://localhost:8000
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Pull & run
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          docker rm -f enterprise-python-dev 2>&1 | Out-Null
          docker pull "${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}"
          docker run -d --name enterprise-python-dev --restart unless-stopped `
            -p 8000:8000 `
            -e DATABASE_URL="${{ secrets.DEV_DATABASE_URL }}" `
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" `
            "${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}"
          if ($LASTEXITCODE -ne 0) { throw "Deploy DEV failed." }
          Start-Sleep -Seconds 15
          $r = Invoke-WebRequest -Uri "http://localhost:8000/health" -UseBasicParsing -TimeoutSec 10
          if ($r.StatusCode -ne 200) { throw "DEV health check failed: $($r.StatusCode)" }


  # ==========================================================
  # 7. MIGRATE DEV (Windows, Alembic)
  # ==========================================================
  migrate-dev:
    name: Migrate → DEV
    runs-on: [self-hosted, Windows, X64]
    needs: deploy-dev
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Setup venv
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV
          if (Test-Path $venv) { Remove-Item $venv -Recurse -Force }
          & $env:PYTHON_EXE -m venv $venv
          $python = Join-Path $venv "Scripts\python.exe"
          & $python -m pip install --upgrade pip
          & $python -m pip install -r "$env:GITHUB_WORKSPACE\requirements.txt"

      - name: Run Alembic upgrade
        shell: powershell -ExecutionPolicy Bypass -File {0}
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"
          & $python -m alembic upgrade head
          if ($LASTEXITCODE -ne 0) { throw "Alembic migrate DEV failed." }

      - name: Cleanup
        if: always()
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV
          if (Test-Path $venv) { Remove-Item $venv -Recurse -Force }


  # ==========================================================
  # 8. API REGRESSION (Windows)
  # ==========================================================
  api-test-dev:
    name: API Regression (DEV)
    runs-on: [self-hosted, Windows, X64]
    needs: [deploy-dev, migrate-dev]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Setup venv
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV
          if (Test-Path $venv) { Remove-Item $venv -Recurse -Force }
          & $env:PYTHON_EXE -m venv $venv
          $python = Join-Path $venv "Scripts\python.exe"
          & $python -m pip install --upgrade pip
          & $python -m pip install -r "$env:GITHUB_WORKSPACE\requirements.txt"
          & $python -m pip install -r "$env:GITHUB_WORKSPACE\requirements-dev.txt"

      - name: Run API regression tests
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"
          $env:API_BASE_URL = "http://localhost:8000"
          & $python -m pytest tests/test_api.py -m regression --junitxml=api-regression.xml
          if ($LASTEXITCODE -ne 0) { throw "API regression failed." }

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-regression-report
          path: api-regression.xml
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV
          if (Test-Path $venv) { Remove-Item $venv -Recurse -Force }


  # ==========================================================
  # 9. DEPLOY UAT (Windows, gated via GitHub Environment "uat")
  # ==========================================================
  deploy-uat:
    name: Deploy → UAT
    runs-on: [self-hosted, Windows, X64]
    needs: api-test-dev
    environment:
      name: uat
      url: http://localhost:8001
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Pull & run (UAT)
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          docker rm -f enterprise-python-uat 2>&1 | Out-Null
          docker pull "${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}"
          docker run -d --name enterprise-python-uat --restart unless-stopped `
            -p 8001:8000 `
            -e DATABASE_URL="${{ secrets.UAT_DATABASE_URL }}" `
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" `
            "${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}"
          Start-Sleep -Seconds 15
          $r = Invoke-WebRequest -Uri "http://localhost:8001/health" -UseBasicParsing -TimeoutSec 10
          if ($r.StatusCode -ne 200) { throw "UAT health check failed: $($r.StatusCode)" }


  # ==========================================================
  # 10. MIGRATE UAT
  # ==========================================================
  migrate-uat:
    name: Migrate → UAT
    runs-on: [self-hosted, Windows, X64]
    needs: deploy-uat
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Setup venv
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV
          if (Test-Path $venv) { Remove-Item $venv -Recurse -Force }
          & $env:PYTHON_EXE -m venv $venv
          $python = Join-Path $venv "Scripts\python.exe"
          & $python -m pip install --upgrade pip
          & $python -m pip install -r "$env:GITHUB_WORKSPACE\requirements.txt"
      - name: Alembic upgrade
        shell: powershell -ExecutionPolicy Bypass -File {0}
        env:
          DATABASE_URL: ${{ secrets.UAT_DATABASE_URL }}
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"
          & $python -m alembic upgrade head
          if ($LASTEXITCODE -ne 0) { throw "Alembic migrate UAT failed." }
      - name: Cleanup
        if: always()
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV
          if (Test-Path $venv) { Remove-Item $venv -Recurse -Force }


  # ==========================================================
  # 11. PERFORMANCE TEST (ubuntu-latest, Locust)
  # ==========================================================
  performance-test:
    name: Performance Test (UAT)
    runs-on: ubuntu-latest
    needs: migrate-uat
    if: github.ref == 'refs/heads/master'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Locust
        run: pip install locust==2.31.5
      - name: Run Locust
        run: |
          UAT_URL="${{ vars.UAT_PUBLIC_URL || 'http://localhost:8001' }}"
          echo "Target: $UAT_URL"
          if [ -f tests/performance/locustfile.py ]; then
            locust -f tests/performance/locustfile.py --headless -u 50 -r 5 -t 1m \
              --host "$UAT_URL" --csv=perf-report --exit-code-on-error 0 || true
          else
            echo "No locustfile — skipping."
          fi
      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: perf-report*.csv
          if-no-files-found: ignore


  # ==========================================================
  # 12. CHANGE APPROVAL GATE (ubuntu-latest)
  # ==========================================================
  change-approval-gate:
    name: Change Approval Gate
    runs-on: ubuntu-latest
    needs: performance-test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Verify CHANGE_REQUEST_ID
        run: |
          if [ -z "${{ vars.CHANGE_REQUEST_ID }}" ]; then
            echo "::error::CHANGE_REQUEST_ID not set. A linked, approved Change Request is required to promote to PROD."
            exit 1
          fi
          echo "Approved for production release under change ${{ vars.CHANGE_REQUEST_ID }}"


  # ==========================================================
  # 13. DEPLOY PROD (Windows, tag-only, gated via Environment "production")
  # ==========================================================
  deploy-prod:
    name: Deploy → PROD
    runs-on: [self-hosted, Windows, X64]
    needs: change-approval-gate
    environment:
      name: production
      url: http://localhost:8000
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Pull & run (PROD)
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          docker rm -f enterprise-python 2>&1 | Out-Null
          docker pull "${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          docker run -d --name enterprise-python --restart unless-stopped `
            -p 8000:8000 `
            -e DATABASE_URL="${{ secrets.PROD_DATABASE_URL }}" `
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" `
            "${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          Start-Sleep -Seconds 15
          $r = Invoke-WebRequest -Uri "http://localhost:8000/health" -UseBasicParsing -TimeoutSec 10
          if ($r.StatusCode -ne 200) { throw "PROD health check failed: $($r.StatusCode)" }


  # ==========================================================
  # 14. MIGRATE PROD
  # ==========================================================
  migrate-prod:
    name: Migrate → PROD
    runs-on: [self-hosted, Windows, X64]
    needs: deploy-prod
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Setup venv
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV
          if (Test-Path $venv) { Remove-Item $venv -Recurse -Force }
          & $env:PYTHON_EXE -m venv $venv
          $python = Join-Path $venv "Scripts\python.exe"
          & $python -m pip install --upgrade pip
          & $python -m pip install -r "$env:GITHUB_WORKSPACE\requirements.txt"
      - name: Alembic upgrade
        shell: powershell -ExecutionPolicy Bypass -File {0}
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"
          & $python -m alembic upgrade head
          if ($LASTEXITCODE -ne 0) { throw "Alembic migrate PROD failed." }
      - name: Cleanup
        if: always()
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV
          if (Test-Path $venv) { Remove-Item $venv -Recurse -Force }


  # ==========================================================
  # 15. RELEASE (Windows) — GitHub Release on tag
  # ==========================================================
  release:
    name: Create Release
    runs-on: [self-hosted, Windows, X64]
    needs: migrate-prod
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true


  # ==========================================================
  # 16. NOTIFY (Windows) — Slack webhook (optional)
  # ==========================================================
  notify:
    name: Notify
    runs-on: [self-hosted, Windows, X64]
    needs: [test, qa, build]
    if: always() && github.ref == 'refs/heads/master'
    steps:
      - name: Send notification
        shell: powershell
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if (-not $env:SLACK_WEBHOOK_URL) {
            Write-Host "SLACK_WEBHOOK_URL not set — skipping notification."
            exit 0
          }
          $payload = @{
            text = "Enterprise-python CI/CD: ${{ job.status }} on ${{ github.ref_name }} (${{ github.sha }})"
          } | ConvertTo-Json
          Invoke-RestMethod -Uri $env:SLACK_WEBHOOK_URL -Method Post `
            -ContentType "application/json" -Body $payload


  # ==========================================================
  # 17. NIGHTLY HEALTH CHECK (Windows)
  # ==========================================================
  health-check:
    name: Nightly Health Check
    runs-on: [self-hosted, Windows, X64]
    if: github.event_name == 'schedule'
    steps:
      - name: Check /health
        shell: powershell
        run: |
          try {
            $r = Invoke-WebRequest -Uri "http://localhost:8000/health" -UseBasicParsing -TimeoutSec 10
            if ($r.StatusCode -ne 200) { throw "HTTP $($r.StatusCode)" }
            Write-Host "Health OK"
          } catch {
            Write-Host "Health check FAILED: $_"
            exit 1
          }


  # ==========================================================
  # 18. ROLLBACK (Windows, manual via workflow_dispatch)
  # ==========================================================
  rollback-prod:
    name: Rollback PROD (manual)
    runs-on: [self-hosted, Windows, X64]
    environment:
      name: production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag != ''
    steps:
      - name: Rollback to ${{ github.event.inputs.image_tag }}
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $tag = "${{ github.event.inputs.image_tag }}"
          Write-Host "Rolling back PROD to $tag"
          docker rm -f enterprise-python 2>&1 | Out-Null
          docker pull "${{ env.IMAGE_NAME }}:$tag"
          docker run -d --name enterprise-python --restart unless-stopped `
            -p 8000:8000 `
            -e DATABASE_URL="${{ secrets.PROD_DATABASE_URL }}" `
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" `
            "${{ env.IMAGE_NAME }}:$tag"
          Start-Sleep -Seconds 15
          $r = Invoke-WebRequest -Uri "http://localhost:8000/health" -UseBasicParsing -TimeoutSec 10
          if ($r.StatusCode -ne 200) { throw "Rollback health check failed: $($r.StatusCode)" }
